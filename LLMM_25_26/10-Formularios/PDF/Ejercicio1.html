<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
    <link rel="stylesheet" href="ejercicio1.css">
</head>

<body>
    
    <h1> Crea tu cuenta de accesos </h1>

    <div class="Caja">

        <form method="POST">

            <div class="fila">
                <label for="elemento1">Nombre: </label>
                <input type="text" id="elemento1" name="usuario" value="" />
            </div>

            <div class="fila">
                <label for="elemento2">Contraseña: </label>
                <input type="password" id="elemento2" name="pass" />
            </div>

            <div class="fila">
                <label for="elemento3">Edad: </label>
                <input type="number" min="0" max="125" id="elemento3" />
            </div>

            <div class="fila">
                <label for="Acepto las condicciones de uso:">Acepto las condicciones de uso:</label>
                <input type="checkbox" id="Acepto las condicciones de uso:">
            </div>

            <button type="submit" id="cookie-button">Alta</button>
        </form>
    </div>

</body>
</html>

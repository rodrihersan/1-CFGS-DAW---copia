<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14</title>
    <script src="../js/ejercicio14.js"></script>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body onload="ejercicio14()">
    <h1>Formulario</h1>
    <form id="miFormulario" onsubmit="enviarFormulario(event)">
        
        <label>Nombre de usuario:</label>
        <input type="text" id="nombre" name="nombre"><br><br>

        <label>Contraseña:</label>
        <input onfocus="cambiarBorde()"  type="password" id="contrasena" name="contraseña"><br><br>

        <label>Edad:</label>
        <input type="number" id="edad" name="edad"><br><br>

        <div id="campoCuenta"></div>

        <label>Sexo:</label>
        <input type="radio" name="sexo" value="hombre"> Hombre
        <input type="radio" name="sexo" value="mujer"> Mujer <br><br>

        <button type="reset">Limpiar</button>
        <button type="submit">Enviar</button>

    </form>
</body>
</html>

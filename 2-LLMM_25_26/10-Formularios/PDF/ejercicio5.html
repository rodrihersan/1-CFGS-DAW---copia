<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio2</title>

<body>
    
     <div class="Caja">

        <form method="POST">

            <div class="fila">
                <label for="hombre">Señor: </label>
                <input type="radio" id="hombre" value="h" name="hm" required>

                <label for="mujer">Señora: </label>
                <input type="radio" value="m" id="mujer" name="hm" required>
            </div>

            <div class="fila">
                <label for="nombre">Nombre: </label>
                <input type="text" id="nombre" name="usuario">
            </div>

            <div class="fila">
                <label for="email">Email: </label>
                <input type="emai" id="email" name="correo">
            </div>

            <div class="fila">
                <label for="rango">Rango de edad:</label>
                <select name="menu">
                    <option value="0">___</option>
                    <option value="Entre 18 y 29">Entre 18 y 29</option>
                    <option value="Entre 30 y 45">Entre 30 y 45</option>
                    <option value="Entre 46 y 60">Entre 46 y 60</option>
                    <option value="Mayor de 60">Mayor de 60</option>
                </select>
            </div>

            <div class="fila">
                <button type="submit" id="Send-button">Enviar</button>
                <button type="reset" id="cookie-button">Limpiar</button>
            </div>

        </form>

    </div>


</body>
